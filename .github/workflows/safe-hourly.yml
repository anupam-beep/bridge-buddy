name: Bridge Buddy Safe Hourly Checks
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridge-buddy-safe-hourly
  cancel-in-progress: false
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline safety and health checks
        run: python -m unittest discover -s tests -v
      - name: Generate offline evidence inventory
        if: always()
        run: python scripts/offline_health.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-buddy-hourly-health
          path: reports/health.json
          retention-days: 14
